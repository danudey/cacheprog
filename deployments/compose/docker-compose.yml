services:
  toxiproxy:
    image: ${TOXIPROXY_IMAGE:-ghcr.io/shopify/toxiproxy:2.12.0}
    restart: always
    ports:
      - "8474:8474"
      - "9000:9000" # for minio, simulate network latency
    volumes:
      - ./toxiproxy.json:/toxiproxy.json:ro
    command: -config /toxiproxy.json
    networks:
      - minio_network
  minio:
    # Silo (github.com/pgsty/silo) is a MinIO fork; the official minio/minio images are no longer published.
    image: ${MINIO_IMAGE:-pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46}
    restart: always
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - minio_network
  mc:
    image: ${MINIO_IMAGE:-pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46}
    container_name: minio-client
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: 
      - /bin/bash
      - -c
      - |
        set -eou pipefail;
        until mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
          echo 'Waiting for MinIO to be ready...'
          sleep 1
        done;
        mc mb --ignore-existing myminio/files-bucket;
        read -s;
    healthcheck:
      test: ["CMD", "mc", "stat", "myminio/files-bucket"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - minio_network
    stdin_open: true
    tty: true

networks:
  minio_network:
